name: Wake up Streamlit Apps

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit apps and wake them if asleep
        # A plain curl/wget can't do this: Streamlit Cloud's wake-up endpoint
        # is CSRF-protected and only responds to a real click inside the
        # loaded page. So instead of calling their API directly, this drives
        # an actual headless browser to do exactly what a visitor would do:
        # open the app, and click "Yes, get this app back up!" if it's there.
        run: |
          python <<'EOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://marwan-drug-discovery.streamlit.app/",
              "https://marwan-rnaseq-dashboard.streamlit.app/",
              "https://marwan-retail-demand-forecasting.streamlit.app/",
              "https://marwan-melanoma-detection.streamlit.app/",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for url in URLS:
                  page = browser.new_page()
                  page.goto(url, timeout=60000)
                  try:
                      btn = page.get_by_text("Yes, get this app back up!", exact=False)
                      btn.wait_for(timeout=5000)
                      btn.click()
                      print(f"{url}: was asleep -> clicked wake button")
                      page.wait_for_timeout(30000)
                  except Exception:
                      print(f"{url}: already awake, nothing to click")
                  page.close()
              browser.close()
          EOF
