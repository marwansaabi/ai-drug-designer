name: Wake up Streamlit Apps

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Apps
        # Streamlit Cloud bounces anonymous requests through share.streamlit.io
        # to set a viewer session cookie before serving the app. curl needs a
        # cookie jar (-c/-b) to carry that cookie across the redirect, or it
        # loops between the app and the auth endpoint and never actually hits
        # the running app (which is why the plain `curl -I` version never worked).
        run: |
          for url in \
            https://marwan-drug-discovery.streamlit.app/ \
            https://marwan-rnaseq-dashboard.streamlit.app/ ; do
            rm -f cookies.txt
            code=$(curl -sL --max-redirs 15 -c cookies.txt -b cookies.txt \
              -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::warning::$url returned $code instead of 200"
            fi
          done
