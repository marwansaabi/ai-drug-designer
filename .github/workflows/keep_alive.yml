name: Wake up Streamlit Apps

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Apps
        run: |
          curl -sL -o /dev/null -w "%{url_effective} -> %{http_code}\n" https://marwan-drug-discovery.streamlit.app/
          curl -sL -o /dev/null -w "%{url_effective} -> %{http_code}\n" https://marwan-rnaseq-dashboard.streamlit.app/
